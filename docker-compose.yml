version: '3.8'

services:
  app:
    image: node:lts
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - .:/app
    # Ensure node_modules are not overwritten if they don't exist on host, 
    # but here they do. 
    # Use polling for better file watching on Windows/WSL
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host
